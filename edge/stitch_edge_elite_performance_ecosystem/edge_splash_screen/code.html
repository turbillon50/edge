<style>
        body {
            background-color: #000000;
            margin: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
        }

        .atmospheric-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(242, 202, 80, 0.08) 0%, rgba(19, 19, 19, 0) 70%);
            border-radius: 50%;
            filter: blur(60px);
            z-index: 0;
            animation: pulse-glow 8s ease-in-out infinite;
        }

        @keyframes pulse-glow {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.2); opacity: 0.8; }
        }

        .logo-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .metallic-text {
            background: linear-gradient(135deg, #f2ca50 0%, #ffe088 25%, #d4af37 50%, #f2ca50 75%, #ffe088 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-size: 200% auto;
            animation: shine 4s linear infinite;
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        .tagline-reveal {
            opacity: 0;
            transform: translateY(20px);
            animation: fade-up 1.5s cubic-bezier(0.19, 1, 0.22, 1) 0.5s forwards;
        }

        @keyframes fade-up {
            to { opacity: 1; transform: translateY(0); }
        }

        .titanium-stroke {
            border: 1px solid rgba(196, 199, 202, 0.1);
        }

        /* Particles background simulation */
        #particles-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
    </style>
<style>

<body class="bg-background selection:bg-primary/30">
<!-- Atmospheric background elements -->
<div id="particles-container"></div>
<div class="atmospheric-glow"></div>
<!-- Main Splash Content -->
<main class="logo-container">
<!-- Brand identity from JSON -->
<h1 class="metallic-text font-display-hero text-display-hero tracking-tighter mb-4 select-none">
            EDGE
        </h1>
<!-- Subtle divider for visual balance -->
<div class="w-12 h-[1px] bg-primary/30 mb-8 tagline-reveal" style="animation-delay: 0.8s;"></div>
<!-- Tagline -->
<p class="tagline-reveal font-label-caps text-label-caps text-on-surface-variant uppercase tracking-[0.3em] select-none" style="animation-delay: 1.1s;">
            Performance Beyond Limits
        </p>
</main>
<!-- Interactive Layer -->
<div class="fixed bottom-12 left-0 w-full flex justify-center items-center z-20 tagline-reveal" style="animation-delay: 2s;">
<div class="flex flex-col items-center gap-4">
<span class="material-symbols-outlined text-primary animate-bounce" style="font-variation-settings: 'FILL' 0, 'wght' 200;">
                expand_more
            </span>
<div class="text-on-surface-variant/40 font-label-data text-[10px] tracking-[0.2em] uppercase">
                Tap to enter
            </div>
</div>
</div>
<!-- Background Image with vignette (Suppressed but described for model as context) -->
<div class="absolute inset-0 z-[-1] opacity-20 overflow-hidden">
<img class="w-full h-full object-cover scale-110 blur-sm brightness-[0.2]" data-alt="A cinematic, low-angle shot of an elite fitness athlete in a high-end private gym facility. The lighting is moody and atmospheric, with sharp rim lights highlighting muscles against a deep matte black background. Subtle titanium silver reflections glint off high-performance equipment in the periphery. The overall aesthetic is luxurious, focused, and powerful, aligning with a dark-mode obsidian and champagne gold color palette." src="https://lh3.googleusercontent.com/aida-public/AB6AXuB0o0bNXw0pM-9RLpNA9v9Ks5rfBkJcIPjbaUqY8I9tywiFTDLJGoJYx7G_nOO3pjCFl9825h8JY53u11N5SvJy3g7ZY9Tqj5KWKyptQFD40k3ThY-PgANhF6kTLezGy5kPVdaKRcbuG3wphvsM2t2I57MbzFbIPbZx25dBQ83shIf3nU1YCSSogND87Od-geOzAKKqFbq8ct0tbYZ0bkyxy5oZc1uW_1fNVnW7Sr-brDoWlUv9SaD_VRuinw8lDUAVe7UxtmyHwzc"/>

<script>
        // Micro-interaction: Particle effect
        const container = document.getElementById('particles-container');
        const particleCount = 40;

        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            particle.className = 'absolute bg-primary/20 rounded-full';
            
            const size = Math.random() * 2 + 1;
            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            
            particle.style.top = `${Math.random() * 100}%`;
            particle.style.left = `${Math.random() * 100}%`;
            
            const duration = Math.random() * 5 + 5;
            const delay = Math.random() * 5;
            
            particle.style.animation = `float ${duration}s ease-in-out ${delay}s infinite`;
            
            // Define float animation via JS to keep CSS clean
            const keyframes = `
                @keyframes float {
                    0%, 100% { transform: translateY(0) translateX(0); opacity: 0; }
                    50% { transform: translateY(-100px) translateX(${Math.random() * 40 - 20}px); opacity: 0.6; }
                }
            `;
            
            if (i === 0) {
                const styleSheet = document.createElement("style");
                styleSheet.innerText = keyframes;
                document.head.appendChild(styleSheet);
            }
            
            container.appendChild(particle);
        }

        // Tap to enter interaction simulation
        document.body.addEventListener('click', () => {
            document.querySelector('.logo-container').style.transform = 'scale(1.05)';
            document.querySelector('.logo-container').style.opacity = '0';
            document.querySelector('.logo-container').style.transition = 'all 0.8s cubic-bezier(0.19, 1, 0.22, 1)';
            
            setTimeout(() => {
                console.log("Navigation triggered to Dashboard");
                // In a real app: window.location.href = '/dashboard';
            }, 600);
        });
    </script>
