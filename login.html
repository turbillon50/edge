<script>
        // Micro-interaction: Mouse tracking glow
        document.addEventListener('mousemove', (e) => {
            const container = document.querySelector('.glass-panel');
            const rect = container.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            // If mouse is within container bounds
            if (x > 0 && x < rect.width && y > 0 && y < rect.height) {
                container.style.setProperty('--mouse-x', `${x}px`);
                container.style.setProperty('--mouse-y', `${y}px`);
                // Note: Actual dynamic spotlight would need extra div or complex mask-image, 
                // but this placeholder logic shows intent for cinematic interaction.
            }
        });

        // Simple input focus logic to add more "life"
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.style.boxShadow = '0 10px 30px -10px rgba(242, 202, 80, 0.05)';
            });
            input.addEventListener('blur', () => {
                input.parentElement.style.boxShadow = 'none';
            });
        });
    </script>
